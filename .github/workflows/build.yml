name: Build WorldStack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge MDK
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.18.2-40.3.0/forge-1.18.2-40.3.0-mdk.zip
          mkdir forge-mdk
          unzip -q forge-1.18.2-40.3.0-mdk.zip -d forge-mdk

      - name: Prepare Forge project
        run: |
          cp forge-mdk/build.gradle .
          cp forge-mdk/settings.gradle .
          cp forge-mdk/gradle.properties .
          cp forge-mdk/gradlew .
          cp -r forge-mdk/gradle .

      - name: Configure WorldStack
        run: |
          sed -i 's/examplemod/worldstack/g' build.gradle
          sed -i 's/Example Mod/WorldStack/g' build.gradle
          sed -i 's/examplemod/worldstack/g' gradle.properties
          sed -i 's/Example Mod/WorldStack/g' gradle.properties

      - name: Fix resource files
        run: |
          mkdir -p src/main/resources/META-INF

          cat > src/main/resources/pack.mcmeta <<'EOF'
          {
            "pack": {
              "description": "WorldStack Resources",
              "pack_format": 8
            }
          }
          EOF

      - name: Build WorldStack
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify JAR resources
        run: |
          echo "=== JAR CONTENTS ==="
          for file in build/libs/*.jar; do
            echo "Checking: $file"
            jar tf "$file" | grep -E 'pack.mcmeta|mods.toml|WorldStack.class'

            echo "=== PACK METADATA ==="
            unzip -p "$file" pack.mcmeta
          done

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldStack-1.18.2-Forge
          path: build/libs/*.jar
